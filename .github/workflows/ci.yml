# Cortex CI/CD Pipeline
# Runs linting, tests, and build on every push/PR

name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  python-lint-test:
    name: Python Lint & Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff black mypy pytest pytest-asyncio
          pip install -r backend/requirements.txt || true

      - name: Lint with ruff
        run: ruff check backend/ --output-format=github || true

      - name: Format check with black
        run: black --check backend/ || true

      - name: Run tests
        run: python -m pytest tests/ -v --tb=short

  frontend-lint-build:
    name: Frontend Lint & Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: "npm"
          cache-dependency-path: frontend/package.json

      - name: Install dependencies
        working-directory: frontend
        run: npm install

      - name: Lint
        working-directory: frontend
        run: npm run lint || true

      - name: Build
        working-directory: frontend
        run: npm run build

  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [python-lint-test]

    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t cortex:ci .
