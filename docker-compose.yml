# Docker Compose for Cortex Development
# Run backend API + frontend dev server

version: "3.8"

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8888:8888"
    volumes:
      - ./backend:/app/backend
      - cortex-data:/app/data
      - cortex-logs:/app/logs
    environment:
      - PYTHONUNBUFFERED=1
      - PYTHONPATH=/app
      - CORTEX_HEADLESS=1
    restart: unless-stopped

  frontend:
    image: node:18-slim
    working_dir: /app/frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app/frontend
      - frontend-node-modules:/app/frontend/node_modules
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  cortex-data:
  cortex-logs:
  frontend-node-modules:
